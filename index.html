<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="A few things about me" name="description" />
    <meta content="summary" name="twitter:card" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link rel="icon" href="favicon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Noto Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        :root {
            --bg-dark: #121212;
            --text-dark: #ffffff;
            --bg-light: #f5f5f5;
            --text-light: #222222;
        }

        /* Default dark theme */
        body {
            background-color: var(--bg-dark);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Light theme based on system preference */
        @media (prefers-color-scheme: light) {
            body {
                background-color: var(--bg-light);
                color: var(--text-light);
            }
        }

        /* Simulation and text side by side, centred as one group */
        .group {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            padding: 40px 20px;
        }

        .sim {
            flex: none;
            width: 200px;
            height: 200px;
            display: block;
        }

        .content {
            max-width: 560px;
            line-height: 1.6;
        }

        .content p:last-child {
            margin-bottom: 0;
        }

        @media (max-width: 720px) {
            .group {
                flex-direction: column;
                gap: 28px;
            }
        }

        p {
            margin-bottom: 16px;
            font-size: 16px;
        }

        a {
            color: inherit;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        a:hover {
            opacity: 0.8;
        }

        /* Text selection style - inverted colors for dark mode */
        ::selection {
            background-color: var(--text-dark);
            color: var(--bg-dark);
        }

        /* Text selection style - inverted colors for light mode */
        @media (prefers-color-scheme: light) {
            ::selection {
                background-color: var(--text-light);
                color: var(--bg-light);
            }
        }
    </style>
    <title>
        Laurenz Schneeberger
    </title>
</head>

<body>
    <main class="group">
        <canvas class="sim" aria-label="Simulation of the three-body problem" role="img"></canvas>

        <div class="content">
            <p>
                Hi, I'm Laurenz. I study statistics at ETH Zurich.
            </p>
            <p>
                Right now, I'm interested in strategy & ops and complex systems. Reach out on <a
                    href="https://twitter.com/naiveliquid">X</a>, or read my <a
                    href="https://naiveliquid.substack.com/">occasional blog</a>. I post some of my book notes <a
                    href="https://schneeberger.notion.site/reads">here</a>.
            </p>
            <p>
                In covid, I made a bunch of synth music. A compilation of old work can be found <a
                    href="https://soundcloud.com/distortionunit/sets/the-covid-anthology">here</a>
            </p>
        </div>
    </main>

    <script>
        (function () {
            const canvas = document.querySelector('.sim');
            const content = document.querySelector('.content');
            const group = document.querySelector('.group');
            const ctx = canvas.getContext('2d');

            // Keep the simulation a square exactly as tall as the text
            let size = 0;
            function fit() {
                const stacked = getComputedStyle(group).flexDirection === 'column';
                size = stacked ? Math.min(220, content.offsetWidth) : content.offsetHeight;
                const dpr = window.devicePixelRatio || 1;
                canvas.style.width = canvas.style.height = size + 'px';
                canvas.width = canvas.height = Math.round(size * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            new ResizeObserver(fit).observe(content);
            addEventListener('resize', fit);
            fit();

            // Three equal masses under Newtonian gravity (G = m = 1), softened slightly
            // so close encounters stay numerically sane
            const EPS2 = 0.0025;
            const ESCAPE = 3.0;    // restart once a body wanders this far from the centre
            const TRAIL = 260;
            let bodies, trails, fade, view;

            function reset() {
                // Random positions in the unit disc, then velocities scaled so the
                // system is bound (kinetic energy well below the potential energy)
                bodies = [];
                for (let i = 0; i < 3; i++) {
                    const a = Math.random() * Math.PI * 2, r = 0.4 + Math.random() * 0.6;
                    const va = Math.random() * Math.PI * 2;
                    bodies.push({ x: r * Math.cos(a), y: r * Math.sin(a), vx: Math.cos(va), vy: Math.sin(va) });
                }
                let cx = 0, cy = 0, cvx = 0, cvy = 0;
                for (const b of bodies) { cx += b.x / 3; cy += b.y / 3; cvx += b.vx / 3; cvy += b.vy / 3; }
                let ke = 0, pe = 0;
                for (const b of bodies) {
                    b.x -= cx; b.y -= cy; b.vx -= cvx; b.vy -= cvy;
                    ke += 0.5 * (b.vx * b.vx + b.vy * b.vy);
                }
                for (let i = 0; i < 3; i++) for (let j = i + 1; j < 3; j++)
                    pe -= 1 / Math.hypot(bodies[i].x - bodies[j].x, bodies[i].y - bodies[j].y);
                const k = Math.sqrt((0.35 * -pe) / ke);
                for (const b of bodies) { b.vx *= k; b.vy *= k; }
                trails = bodies.map(() => []);
                fade = 0;
                view = extent();
                accel();
            }

            // Half-width the camera should show so every body fits with some margin
            function extent() {
                return Math.max(0.6, 1.25 * Math.max(...bodies.map(b => Math.max(Math.abs(b.x), Math.abs(b.y)))));
            }

            function accel() {
                for (const b of bodies) { b.ax = 0; b.ay = 0; }
                for (let i = 0; i < 3; i++) for (let j = i + 1; j < 3; j++) {
                    const a = bodies[i], b = bodies[j];
                    const dx = b.x - a.x, dy = b.y - a.y;
                    const d2 = dx * dx + dy * dy + EPS2;
                    const f = 1 / (d2 * Math.sqrt(d2));
                    a.ax += dx * f; a.ay += dy * f;
                    b.ax -= dx * f; b.ay -= dy * f;
                }
            }

            // Velocity Verlet: cheap and keeps energy well behaved
            function step(dt) {
                for (const b of bodies) {
                    b.vx += 0.5 * dt * b.ax; b.vy += 0.5 * dt * b.ay;
                    b.x += dt * b.vx; b.y += dt * b.vy;
                }
                accel();
                for (const b of bodies) { b.vx += 0.5 * dt * b.ax; b.vy += 0.5 * dt * b.ay; }
            }

            function draw(color) {
                ctx.clearRect(0, 0, size, size);
                const s = size / (2 * view), c = size / 2;
                ctx.strokeStyle = ctx.fillStyle = color;
                ctx.lineWidth = 1;
                for (let i = 0; i < 3; i++) {
                    const t = trails[i];
                    for (let k = 1; k < t.length; k++) {
                        ctx.globalAlpha = fade * (k / t.length) * 0.6;
                        ctx.beginPath();
                        ctx.moveTo(c + t[k - 1][0] * s, c - t[k - 1][1] * s);
                        ctx.lineTo(c + t[k][0] * s, c - t[k][1] * s);
                        ctx.stroke();
                    }
                    const b = bodies[i];
                    ctx.globalAlpha = fade;
                    ctx.beginPath();
                    ctx.arc(c + b.x * s, c - b.y * s, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }

            reset();
            const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
            let frameCount = 0, leaving = false;
            function frame() {
                for (let n = 0; n < 8; n++) step(0.0015);
                if (frameCount++ % 2 === 0) {
                    for (let i = 0; i < 3; i++) {
                        trails[i].push([bodies[i].x, bodies[i].y]);
                        if (trails[i].length > TRAIL) trails[i].shift();
                    }
                }
                // The camera eases towards the bodies' extent so the orbits always fill the square
                view += (extent() - view) * 0.01;
                // Bound three-body systems eventually fling one body out; fade and start over
                if (bodies.some(b => Math.hypot(b.x, b.y) > ESCAPE)) leaving = true;
                fade = Math.max(0, Math.min(1, fade + (leaving ? -0.02 : 0.02)));
                if (leaving && fade === 0) { reset(); leaving = false; }
                draw(getComputedStyle(document.body).color);
                if (!still) requestAnimationFrame(frame);
            }
            requestAnimationFrame(frame);
        })();
    </script>
</body>

</html>
